name: Build Debug APK

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # 打印 runner 自带的 Android SDK 与版本，便于排查
      - name: inspect sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/platforms" 2>/dev/null || echo "no platforms dir"
          ls -la "$ANDROID_HOME/build-tools" 2>/dev/null || echo "no build-tools dir"
          ls -la "$ANDROID_HOME/cmdline-tools" 2>/dev/null || echo "no cmdline-tools dir"

      - name: accept sdk licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          echo "licenses check done"

      - name: chmod
        run: chmod +x gradlew

      - name: build debug apk
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          CI: "true"

      - name: generate build time
        id: time
        run: echo "now=$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"

      - name: upload debug apk
        uses: actions/upload-artifact@v6
        with:
          name: jm-mobile-debug-${{ steps.time.outputs.now }}
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 7